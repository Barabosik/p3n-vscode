# Unit tests, the .vsix, and the integration tests inside VS Code (stable and the oldest version package.json
# allows). Never calls api.p3n.si: the integration tests run against a stand-in API on localhost.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, 1.90.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the job's token in .git/config for npm install scripts to read.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dev tools
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Package
        run: npm run package

      - name: Integration tests in VS Code ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.vscode == 'stable' }}
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error
